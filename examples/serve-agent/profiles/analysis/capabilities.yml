version: wren-agent-capabilities/1
entry: analyze_data
context_budget_bytes: 4096
capabilities:
- id: orders
  description: Count the rows of a project model, for example the number of orders. The
    private analyst reads the project's structure and business rules to pick the model.
  rules: false
  sql: true
  inputs:
  - question
  - optional reply_to result reference
  outputs:
  - row count
  - session result and evidence references
  limits:
  - the worker is briefed to count the rows of one model; the host does not enforce this scope
  - the worker is briefed not to return raw rows or SQL; the host does not check either
