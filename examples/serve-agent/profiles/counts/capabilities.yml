version: wren-agent-capabilities/1
entry: analyze_data
context_budget_bytes: 4096
capabilities:
- id: orders
  description: Count the rows of a project model, for example the number of orders. This
    deployment offers counts only; do not select this capability for rankings, sums,
    averages, breakdowns or target comparisons.
  rules: false
  sql: true
  inputs:
  - question
  - optional reply_to result reference
  outputs:
  - row count
  - session result and evidence references
  limits:
  - read-only count of one model
  - no raw rows or SQL disclosure
