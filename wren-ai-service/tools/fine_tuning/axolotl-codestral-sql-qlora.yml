# Template only. Run this on a Linux GPU training machine after generating
# train.jsonl/validation.jsonl with prepare_sft_dataset.py.

base_model: mistralai/Codestral-22B-v0.1
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
strict: false

datasets:
  - path: outputs/fine_tuning/codestral-sql/train.jsonl
    type: chat_template

test_datasets:
  - path: outputs/fine_tuning/codestral-sql/validation.jsonl
    type: chat_template

dataset_prepared_path: outputs/fine_tuning/codestral-sql/prepared
output_dir: outputs/fine_tuning/codestral-sql/adapter

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

adapter: qlora
lora_model_dir:
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_linear: true

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 3
optimizer: paged_adamw_8bit
lr_scheduler: cosine
learning_rate: 0.00002
weight_decay: 0.0
warmup_ratio: 0.03
max_grad_norm: 1.0

bf16: auto
tf32: true
gradient_checkpointing: true
flash_attention: true

evals_per_epoch: 2
saves_per_epoch: 1
save_total_limit: 3
logging_steps: 10

special_tokens:
  pad_token: "<pad>"
