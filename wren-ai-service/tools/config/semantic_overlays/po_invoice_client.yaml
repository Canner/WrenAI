models:
  po_invoices:
    displayName: PO Invoices
    description: Purchase order invoice header records. Use this as the primary business model for PO invoice/order questions, supplier invoice questions, invoice status/workflow questions, and invoice-level reporting.
    columns:
      docnumber:
        displayName: Document Number
        description: Primary invoice document number. Join to invoice workflow, comments, attachments, status, and invoice line-item details by this field.
      bunit:
        displayName: Business Unit
        description: Business unit for the invoice. Join to Common_BUnits.bunit and use for business unit filters/grouping.
      supplierid:
        displayName: Supplier ID
        description: Supplier identifier for the invoice. Join with supplierMaster.supplierid and supplierMaster_critical.supplierid together with bunit.
      porder:
        displayName: Purchase Order Number
        description: Purchase order number linked to the invoice. Use for prepayment and PO line relationships when present.
      pocurrency:
        displayName: PO Currency
        description: Purchase order currency code. Join with common_currency.currency together with bunit.

  POInvoices_LineItem:
    displayName: PO Invoice Line Items
    description: Purchase order invoice line details. Use this for invoice line, PO line, PO sequence, and invoice amount/detail questions.
    columns:
      docnumber:
        description: Invoice document number that links each line item to po_invoices.docnumber.
      porder:
        description: Purchase order number for the invoice line.
      poline:
        description: Purchase order line number for the invoice line.
      posequence:
        description: Purchase order sequence number for matching invoice lines to PO master lines.

  PONonInvoices_LineItem:
    displayName: Non-PO Invoice Line Items
    description: Non-PO invoice line details with accounting, cost center, WBS, product, customer, business partner, and profit center dimensions.
    columns:
      docnumber:
        description: Invoice document number that links each non-PO line item to po_invoices.docnumber.
      glaccount:
        description: General ledger account code. Join to common_GLaccount.glaccount.
      costcenter:
        description: Cost center code. Join to common_costcenter.costcenter.
      profitcenter:
        description: Profit center code. Join to common_profitcenter.profitcenter.
      wbselement:
        description: WBS element code. Join to common_wbs.wbselement when present.
      projectccode:
        description: Project or WBS code. Join to common_wbs.wbselement when this is the deployed WBS column.
      productline:
        description: Product line code. Join to common_productlines.productline. For BAAN ERP business units, this may identify the customer via customermaster.customerid.
      productcode:
        description: Product code. Join to common_productcodes.productcode.
      bpNumber:
        description: SAP business partner number. For SAP ERP business units, join to S4BusinessPartners.bpNumber.
      customerid:
        description: Customer identifier. Join to customermaster.customerid when present.

  POMaster:
    displayName: Purchase Order Master
    description: Purchase order master/header and PO line reference information used to connect PO invoice line items to purchase orders.

  supplierMaster:
    displayName: Supplier Master
    description: Supplier master data by business unit and supplier ID. Use to answer supplier attributes for PO invoices.

  supplierMaster_critical:
    displayName: Supplier Critical Information
    description: Supplier critical information by business unit and supplier ID. Use for critical supplier attributes and flags.

  Common_BUnits:
    displayName: Business Units
    description: Business unit master data. Use bunit as the business unit key and erpsystem, when present, to distinguish SAP and BAAN ERP-specific relationships.

  Common_Prepayment_PO:
    displayName: PO Prepayments
    description: Purchase order prepayment records linked to PO invoices by business unit, supplier, and purchase order/prepayment number.

  common_currency:
    displayName: Currency
    description: Currency master by business unit and currency code.

  common_GLaccount:
    displayName: GL Accounts
    description: General ledger account master data by business unit and GL account.

  S4BusinessPartners:
    displayName: SAP Business Partners
    description: SAP ERP business partner master. Use for SAP ERP business units when Common_BUnits.erpsystem is SAP.

  common_costcenter:
    displayName: Cost Centers
    description: Cost center master data by business unit and cost center.

  common_wbs:
    displayName: WBS Elements
    description: Work breakdown structure master data by business unit and WBS element.

  common_productlines:
    displayName: Product Lines
    description: Product line master data by business unit and product line.

  customermaster:
    displayName: Customer Master
    description: Customer master data by business unit and customer ID. Use for BAAN ERP business units when Common_BUnits.erpsystem is BaaN.

  common_productcodes:
    displayName: Product Codes
    description: Product code master data by business unit and product code.

  common_profitcenter:
    displayName: Profit Centers
    description: Profit center master data by business unit and profit center.

  POWorkflow_Comments:
    displayName: PO Workflow Comments
    description: Workflow comments linked to PO invoice document numbers.

  POWorkflow_Attachments:
    displayName: PO Workflow Attachments
    description: Workflow attachments linked to PO invoice document numbers.

  POWorkflow:
    displayName: PO Workflow
    description: Workflow records linked to PO invoice document numbers.

  POWorkflow_Status:
    displayName: PO Workflow Status
    description: Workflow status records linked to PO invoice document numbers.

relationships:
  - name: po_invoices_supplierMaster_critical
    fromModel: po_invoices
    toModel: supplierMaster_critical
    type: MANY_TO_ONE
    description: Each PO invoice can be enriched with critical supplier information using business unit and supplier ID.
    join:
      - from: bunit
        to: bunit
      - from: supplierid
        to: supplierid

  - name: po_invoices_supplierMaster
    fromModel: po_invoices
    toModel: supplierMaster
    type: MANY_TO_ONE
    description: Each PO invoice belongs to a supplier in the supplier master using business unit and supplier ID.
    join:
      - from: bunit
        to: bunit
      - from: supplierid
        to: supplierid

  - name: po_invoices_Common_BUnits
    fromModel: po_invoices
    toModel: Common_BUnits
    type: MANY_TO_ONE
    description: Each PO invoice belongs to one business unit.
    join:
      - from: bunit
        to: bunit

  - name: po_invoices_POWorkflow_Comments
    fromModel: po_invoices
    toModel: POWorkflow_Comments
    type: ONE_TO_MANY
    description: PO invoice document numbers can have workflow comments.
    join:
      - from: docnumber
        to: docnumber

  - name: po_invoices_POWorkflow_Attachments
    fromModel: po_invoices
    toModel: POWorkflow_Attachments
    type: ONE_TO_MANY
    description: PO invoice document numbers can have workflow attachments.
    join:
      - from: docnumber
        to: docnumber

  - name: po_invoices_POWorkflow
    fromModel: po_invoices
    toModel: POWorkflow
    type: ONE_TO_MANY
    description: PO invoice document numbers can have workflow records.
    join:
      - from: docnumber
        to: docnumber

  - name: po_invoices_POWorkflow_Status
    fromModel: po_invoices
    toModel: POWorkflow_Status
    type: ONE_TO_MANY
    description: PO invoice document numbers can have workflow status records.
    join:
      - from: docnumber
        to: docnumber

  - name: po_invoices_Common_Prepayment_PO
    fromModel: po_invoices
    toModel: Common_Prepayment_PO
    type: ONE_TO_MANY
    description: PO invoices link to prepayment records by business unit, supplier ID, and purchase order/prepayment number.
    join:
      - from: bunit
        to: bunit
      - from: supplierid
        to: supplierid
      - from: porder
        to: ponumber

  - name: po_invoices_common_currency
    fromModel: po_invoices
    toModel: common_currency
    type: MANY_TO_ONE
    description: PO invoices use the PO currency code from the currency master.
    join:
      - from: bunit
        to: bunit
      - from: pocurrency
        to: currency

  - name: po_invoices_POInvoices_LineItem
    fromModel: po_invoices
    toModel: POInvoices_LineItem
    type: ONE_TO_MANY
    description: PO invoices have invoice line items by document number.
    join:
      - from: docnumber
        to: docnumber

  - name: POInvoices_LineItem_POMaster
    fromModel: POInvoices_LineItem
    toModel: POMaster
    type: MANY_TO_ONE
    description: PO invoice line items link to PO master lines by purchase order, PO line, and PO sequence.
    join:
      - from: porder
        to: porder
      - from: poline
        to: poline
      - from: posequence
        to: poseqn

  - name: po_invoices_PONonInvoices_LineItem
    fromModel: po_invoices
    toModel: PONonInvoices_LineItem
    type: ONE_TO_MANY
    description: PO invoice headers can have non-PO invoice line details by document number.
    join:
      - from: docnumber
        to: docnumber

  - name: PONonInvoices_LineItem_common_GLaccount
    fromModel: PONonInvoices_LineItem
    toModel: common_GLaccount
    type: MANY_TO_ONE
    description: Non-PO invoice line items link to GL account master by GL account.
    join:
      - from: glaccount
        to: glaccount

  - name: PONonInvoices_LineItem_S4BusinessPartners
    fromModel: PONonInvoices_LineItem
    toModel: S4BusinessPartners
    type: MANY_TO_ONE
    description: For SAP ERP business units, non-PO invoice line items link to SAP business partners by business partner number.
    businessRule: Use this relationship when Common_BUnits.erpsystem is SAP.
    join:
      - from: glaccount
        to: bpNumber

  - name: PONonInvoices_LineItem_common_costcenter
    fromModel: PONonInvoices_LineItem
    toModel: common_costcenter
    type: MANY_TO_ONE
    description: Non-PO invoice line items link to cost center master by cost center.
    join:
      - from: costcenter
        to: costcenter

  - name: PONonInvoices_LineItem_common_wbs
    fromModel: PONonInvoices_LineItem
    toModel: common_wbs
    type: MANY_TO_ONE
    description: Non-PO invoice line items link to WBS master by project/WBS code.
    join:
      - from: projectccode
        to: wbselement

  - name: PONonInvoices_LineItem_common_productlines
    fromModel: PONonInvoices_LineItem
    toModel: common_productlines
    type: MANY_TO_ONE
    description: Non-PO invoice line items link to product line master by product line.
    join:
      - from: productline
        to: productline

  - name: PONonInvoices_LineItem_customermaster
    fromModel: PONonInvoices_LineItem
    toModel: customermaster
    type: MANY_TO_ONE
    description: For BAAN ERP business units, non-PO invoice line items can identify the customer through product line to customer ID.
    businessRule: Use this relationship when Common_BUnits.erpsystem is BaaN.
    join:
      - from: productline
        to: customerid

  - name: PONonInvoices_LineItem_common_productcodes
    fromModel: PONonInvoices_LineItem
    toModel: common_productcodes
    type: MANY_TO_ONE
    description: Non-PO invoice line items link to product code master by product code.
    join:
      - from: productcode
        to: productcode

  - name: PONonInvoices_LineItem_common_profitcenter
    fromModel: PONonInvoices_LineItem
    toModel: common_profitcenter
    type: MANY_TO_ONE
    description: Non-PO invoice line items link to profit center master by profit center.
    join:
      - from: profitcenter
        to: profitcenter
