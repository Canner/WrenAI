# Coarse context binding: the whole v5-jaffle semantic layer, bound as a PREPARED document.
#
# `kind: prepared` means Warble does not read the semantic layer itself — it reads the JSON document
# `document:` names, which WrenAI's own `wren-context-loader` generator produced from the project.
# Warble therefore needs no knowledge of MDL, and the projection Wren hands it is the one Wren
# controls. The binding stays "coarse" in the original sense: it names the whole project, not a
# specific metric/grain.
#
# `project:` is the layer's IDENTITY, not a path Warble reads, and never the document's path — it is
# what the compiled prompts call the project the agent is working on. `document:` is the separate
# field carrying the file. Both resolve relative to this Warble project's own root (the profile
# directory), not relative to this file.
#
# The host rewrites this `project:` line to the user's own wren project at bind time and regenerates
# `document:`'s file in place; the committed values pin this repo's own v5 example so the profile
# compiles standalone for CI/dev. See MAINTAINING.md for how to regenerate the committed document.
kind: prepared
project: ../../../../examples/v5-jaffle
document: context/context.json
