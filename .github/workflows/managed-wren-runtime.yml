name: Stage managed Wren runtime

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable managed-Wren release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact closure and emit review metadata only
        run: |
          mkdir -p release/wheels release/runtime
          python -m pip download --only-binary=:all: --platform macosx_11_0_arm64 --python-version 3.11 --implementation cp --dest release/wheels 'wrenai==0.13.0'
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          rows = []
          for wheel in sorted(pathlib.Path('release/wheels').glob('*.whl')):
            with zipfile.ZipFile(wheel) as z:
              meta = next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))
              values = dict(line.split(': ', 1) for line in z.read(meta).decode('utf8', 'replace').splitlines() if ': ' in line)
            rows.append({'filename': wheel.name, 'sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'distribution': values['Name'].lower().replace('-', '_'), 'version': values['Version'], 'license': values.get('License', 'UNKNOWN'), 'sourceUrl': 'https://pypi.org/project/' + values['Name'] + '/' + values['Version'] + '/'})
          pathlib.Path('release/wheel-inputs.json').write_text(json.dumps(rows))
          pathlib.Path('release/wheel-license-inventory.json').write_text(json.dumps({'schema': 1, 'wheels': rows}, indent=2))
          PY
          curl --fail --location --proto '=https' --tlsv1.2 -o release/python.tar.gz 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.11.16%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          test "$(shasum -a 256 release/python.tar.gz | awk '{print $1}')" = 50424fa409e8ae84b82a3052522f64695b47dff2158b70bb7358e0ebd6c085c9
          /usr/bin/tar -xzf release/python.tar.gz -C release/runtime
          release/runtime/python/install/bin/python3.11 -m venv release/runtime/venv
          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path('release/wheel-inputs.json').read_text())
          pathlib.Path('release/requirements.txt').write_text(''.join('{}=={} --hash=sha256:{}\n'.format(row['distribution'], row['version'], row['sha256']) for row in rows))
          PY
          release/runtime/venv/bin/python -m pip install --no-index --no-deps --require-hashes --find-links release/wheels -r release/requirements.txt
          node apps/genbi/scripts/managed-wren-release.mjs release "${{ inputs.runtime_tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: managed-wren-review-metadata
          path: |
            release/*.json

  publish-approved-runtime:
    needs: stage
    environment: managed-wren-license-approved
    permissions:
      contents: write
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: managed-wren-review-metadata
          path: release
      - name: Require protected-environment digest approval
        env:
          APPROVAL_DIGEST: ${{ secrets.MANAGED_WREN_APPROVAL_SHA256 }}
        run: |
          test -n "$APPROVAL_DIGEST"
          test "$APPROVAL_DIGEST" = "$(shasum -a 256 release/managed-wren-manifest.candidate.json | awk '{print $1}')"
      - name: Re-fetch and verify exact release assets
        run: |
          mkdir -p release/assets
          curl --fail --location --proto '=https' --tlsv1.2 -o release/assets/python.tar.gz 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.11.16%2B20260901-aarch64-apple-darwin-install_only.tar.gz'
          test "$(shasum -a 256 release/assets/python.tar.gz | awk '{print $1}')" = 50424fa409e8ae84b82a3052522f64695b47dff2158b70bb7358e0ebd6c085c9
          python -m pip download --only-binary=:all: --platform macosx_11_0_arm64 --python-version 3.11 --implementation cp --dest release/assets/wheels 'wrenai==0.13.0'
      - name: Emit approved immutable manifest
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('release/managed-wren-manifest.candidate.json'));m.activation='approved';m.licenseApproval={state:'approved',evidence:'protected-environment-digest'};fs.writeFileSync('release/managed-wren-manifest.json',JSON.stringify(m,null,2)+'\\n')"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.runtime_tag }}" release/assets/python.tar.gz release/assets/wheels/*.whl release/*.json
