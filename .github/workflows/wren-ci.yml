name: Wren SDK CI
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - 'core/wren/**'
      - 'core/wren-core/**'
      - 'core/wren-core-py/**'
      - 'core/wren-core-base/**'
      - 'core/wren-context-loader/**'
      - 'examples/serve-agent/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Lint
        run: |
          # tests/unit is linted file by file: only the serve-agent suites are held to
          # ruff format, the rest of the tree predates that gate.
          targets=(
            src/
            tests/unit/test_agent_*.py
            tests/unit/test_context_adapter.py
            tests/unit/test_declared_default*.py
            tests/unit/test_governed_stdio.py
            tests/unit/test_query_gate_termination.py
            tests/unit/test_query_semantics.py
            tests/policy-runtime/test_policy_denial.py
            tests/unit/test_read_only.py
            ../../examples/serve-agent
          )
          uvx ruff format --check --config pyproject.toml "${targets[@]}"
          uvx ruff check --config pyproject.toml "${targets[@]}"

  test-unit:
    name: unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Run unit tests
        # Run the whole tests/unit/ tree rather than filtering on `-m unit`:
        # the marker is opt-in, so any unmarked file (e.g. test_context_cli.py)
        # was silently skipped. Exclude test_memory.py — it needs the `memory`
        # extra and runs in the dedicated `memory tests` job below. Exclude
        # test_mcp_server.py — it needs the `mcp` extra and runs in the
        # dedicated `mcp tests` job below.
        run: |
          uv run --no-sync pytest tests/unit/ -v \
            --ignore=tests/unit/test_memory.py \
            --ignore=tests/unit/test_mcp_server.py

  test-connector:
    name: ${{ matrix.datasource }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - datasource: postgres
            extra: postgres
            test_file: tests/connectors/test_postgres.py
            marker: postgres
          - datasource: mysql
            extra: mysql
            test_file: >-
              tests/connectors/test_mysql.py
              tests/connectors/test_mysql_connector.py
            marker: mysql
          - datasource: starrocks
            extra: mysql
            test_file: tests/connectors/test_starrocks.py
            marker: starrocks
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install system dependencies for mysqlclient
        if: matrix.extra == 'mysql'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked --extra ${{ matrix.extra }}
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Run ${{ matrix.datasource }} tests
        run: uv run --no-sync pytest ${{ matrix.test_file }} -v -m ${{ matrix.marker }}

  test-ui:
    name: ui tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked --extra ui
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Run UI tests
        run: uv run --no-sync pytest tests/test_profile_web.py tests/test_field_registry.py -v

  test-memory:
    name: memory tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked --extra memory
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-MiniLM-L3-v2
      - name: Run memory tests
        env:
          WREN_EMBEDDING_MODEL: paraphrase-MiniLM-L3-v2
        run: uv run --no-sync pytest tests/unit/test_memory.py -v

  test-memory-onnx:
    name: memory tests (onnx, torch-free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked --extra memory-onnx
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Assert the install is torch-free
        # The whole point of this extra: on linux-x86_64 the sentence-transformers
        # path resolves the CUDA build of torch plus triton and sixteen nvidia-*
        # packages. Checking torch alone would miss a resolution that drops
        # torch but keeps the CUDA payload, which is where the gigabytes are.
        run: |
          if uv run --no-sync python -c "import importlib.util as u; raise SystemExit(0 if u.find_spec('torch') else 1)"; then
            echo "::error::torch was installed by the memory-onnx extra"
            exit 1
          fi
          cuda=$(uv pip list --format=freeze | grep -iE '^(nvidia-|triton==)' || true)
          if [ -n "$cuda" ]; then
            echo "::error::CUDA packages were installed by the memory-onnx extra"
            echo "$cuda"
            exit 1
          fi
      - name: Cache ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-onnx-paraphrase-MiniLM-L3-v2
      - name: Run memory tests
        env:
          WREN_EMBEDDING_MODEL: paraphrase-MiniLM-L3-v2
        run: uv run --no-sync pytest tests/unit/test_memory.py -v

  test-embedding-parity:
    name: embedding backend parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install both embedding extras
        # Each of the two jobs above installs one backend, so the parity test
        # importorskips out of both. It is the assertion existing stores
        # depend on — a store written by one backend has to stay readable by
        # the other — so it needs a job where both are present.
        run: uv sync --locked --extra memory --extra memory-onnx
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-parity-paraphrase-multilingual-MiniLM-L12-v2
      - name: Compare backends
        run: uv run --no-sync pytest tests/unit/test_memory.py -v -k TestOnnxVectorParity

  test-mcp:
    name: mcp tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked --extra mcp
          # Exercise consumer dependency resolution as well as the checked-in lock.
          uv pip install --upgrade-package mcp '.[mcp]'
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Run mcp tests
        run: uv run --no-sync pytest tests/unit/test_mcp_server.py -v

  test-agent:
    env:
      WREN_REQUIRE_CONTEXT_LOADER: "1"
      WREN_CONTEXT_LOADER_BIN: ${{ github.workspace }}/core/wren-context-loader/target/debug/wren-context-loader
    name: agent service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/wren
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./core/wren-core-py/target/
          key: ${{ runner.os }}-cargo-wren-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wren-core-py wheel
        working-directory: core/wren-core-py
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync maturin build
      - name: Install dependencies
        run: |
          uv sync --locked --extra mcp
          uv pip install --reinstall --no-index --find-links ../wren-core-py/target/wheels/ wren-core-py
      - name: Cache context loader build
        uses: actions/cache@v4
        with:
          path: core/wren-context-loader/target/
          key: context-loader-agent-${{ runner.os }}-${{ hashFiles('core/wren-context-loader/Cargo.lock') }}
      - name: Build context loader
        working-directory: .
        run: cargo build --locked --manifest-path core/wren-context-loader/Cargo.toml
      # The Warble compiler is the published CLI. The private runtime (@warble/pi) is not
      # published, so this job runs the scripted runtime in tests/unit/fixtures: the tests
      # that need a real Cedar engine skip here and are a local gate
      # (examples/serve-agent/README.md, "Re-run the checks").
      - name: Install the Warble CLI
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/warble-cli" --no-audit --no-fund @warble/cli@0.19.0
          echo "WARBLE_BIN=$RUNNER_TEMP/warble-cli/node_modules/.bin/warble" >> "$GITHUB_ENV"
          echo "WARBLE_SERVICE=$GITHUB_WORKSPACE/core/wren/tests/unit/fixtures/fake_runtime.js" >> "$GITHUB_ENV"
      # A separately authored test peer uses only the published Cedar evaluator.
      # It proves host denial before execution without distributing a model runtime.
      - name: Install real Cedar test evaluator
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/policy-runtime
      - name: Run host policy boundary tests
        run: uv run --no-sync pytest tests/policy-runtime/test_policy_denial.py -v
      - name: Run agent service tests
        run: |
          uv run --no-sync pytest \
            tests/unit/test_agent_service.py \
            tests/unit/test_agent_sql.py \
            tests/unit/test_agent_query_lifetime.py \
            tests/unit/test_context_adapter.py \
            tests/unit/test_declared_default_fx.py \
            tests/unit/test_declared_default_status.py \
            tests/unit/test_query_gate_termination.py \
            -v
