name: Private-first planner experiment
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'examples/private-first-planner/**'
      - '.github/workflows/private-first-planner-ci.yml'
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/private-first-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline contract and race tests
        run: node --test test/*.test.mjs
      - name: Scripted walkthrough
        run: node demo.mjs
      - name: Install P1 MCP client
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix p1
      - name: Offline P1 protocol and provider tests
        run: node --test p1/test/*.test.mjs
      - name: Offline cloud disclosure, launcher and renderer tests
        run: node --test p2/test/*.test.mjs
      - name: Offline paired benchmark tests
        run: node --test p4/test/*.test.mjs
      - name: Offline free frontend contracts
        run: node --test p5/test/contracts.test.mjs
      - name: Install pinned host and pi dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix host
      - name: Durable host, pi loop and trusted UI contracts
        run: node --test host/test/*.test.mjs
      - name: Independent harness contracts and scoring
        run: node --test eval/test/*.test.mjs
      - name: Independent data verification regression
        run: node eval/data-validation.mjs "$RUNNER_TEMP/data-verification-eval"
      - name: Install pinned behavior compiler
        run: npm install --global @warble/cli@0.21.1 --no-audit --no-fund
      - name: Verify generated Warble behavior artifact
        run: node behaviors/compile.mjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixture script syntax
        run: python -m py_compile p1/prepare.py
      - name: Install pinned Wren release
        run: python -m pip install -r p1/requirements.txt
      - name: Released SQL parser compatibility
        run: python p1/test/release_compat.py

  isolated-browser:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: examples/private-first-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix p5
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix host
      - run: p5/node_modules/.bin/playwright install chromium
      - name: Browser data binding, isolation and watchdog
        run: node --test p5/test/browser.test.mjs
      - name: Host repair and isolated viewer
        run: node --test host/browser.test.mjs
      - name: Independent cloud harness with real browser QA
        run: node eval/run.mjs cloud-planner "$RUNNER_TEMP/cloud-unit-eval" --browser

  worker-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/private-first-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build context loader
        run: cargo build --locked --release --manifest-path ../../core/wren-context-loader/Cargo.toml
      - name: Install pinned service and runtime
        run: |
          python -m pip install -r p1/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix p1
          npm ci --ignore-scripts --no-audit --no-fund --prefix host
          npm install --prefix "$RUNNER_TEMP/harness-runtime" --no-audit --no-fund @warble/pi@0.21.1 @warble/cli@0.21.1
      - name: Write explicit local runtime bindings
        run: |
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          runtime = Path(os.environ['RUNNER_TEMP']) / 'harness-runtime/node_modules'
          config = {'python': sys.executable, 'wren': shutil.which('wren'),
                    'warble': str(runtime / '.bin/warble'),
                    'runtime': str(runtime / '@warble/pi/dist/service.js'),
                    'context_loader': str(Path('../../core/wren-context-loader/target/release/wren-context-loader').resolve())}
          (Path(os.environ['RUNNER_TEMP']) / 'worker-config.json').write_text(json.dumps(config))
          PY
      - name: Real Wren service and database with scripted loopback model
        run: node eval/run.mjs data-worker "$RUNNER_TEMP/worker-unit-eval" "$RUNNER_TEMP/worker-config.json"
      - name: Whole host through real Wren with scripted models
        run: node host/verify.mjs "$RUNNER_TEMP/host-e2e" "$RUNNER_TEMP/worker-config.json"
