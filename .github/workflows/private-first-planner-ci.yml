name: Private-first collaboration baseline
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'examples/private-first-planner/**'
      - 'examples/serve-agent/setup.py'
      - 'examples/serve-agent/policy.cedar'
      - 'examples/serve-agent/adhoc-policy.cedar'
      - 'core/wren-context-loader/**'
      - '.github/workflows/private-first-planner-ci.yml'
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/private-first-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency-free worker handoff
        run: node collaboration/check.mjs worker-contracts "$RUNNER_TEMP/worker-contracts"
      - name: Install locked client, host and compiler
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix host/adapters
          npm ci --ignore-scripts --no-audit --no-fund --prefix host
          npm ci --no-audit --no-fund --prefix collaboration/runtime
      - name: Offline regressions and independent units
        run: node collaboration/check.mjs offline "$RUNNER_TEMP/offline"
      - name: Verify generated Warble behavior
        env:
          WARBLE_BIN: ./collaboration/runtime/node_modules/.bin/warble
        run: node collaboration/check.mjs behaviors "$RUNNER_TEMP/behaviors"
      - name: Produce tracked source handoff without run artifacts
        run: node collaboration/package.mjs "$RUNNER_TEMP/source-package"

  isolated-browser:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/private-first-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked browser and host clients
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix host/adapters
          npm ci --ignore-scripts --no-audit --no-fund --prefix design
          npm ci --ignore-scripts --no-audit --no-fund --prefix host
          design/node_modules/.bin/playwright install chromium
      - name: Actual isolated browser, host repair and cloud unit
        run: node collaboration/check.mjs browser "$RUNNER_TEMP/browser"

      - name: Interactive aggregate dashboard journeys and failure probes
        run: node collaboration/check.mjs interactive "$RUNNER_TEMP/interactive"

  worker-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/private-first-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build context loader
        run: cargo build --locked --release --manifest-path ../../core/wren-context-loader/Cargo.toml
      - name: Install pinned service and locked runtime
        run: |
          python -m pip install -r worker/requirements.txt -c collaboration/python-constraints.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix host/adapters
          npm ci --ignore-scripts --no-audit --no-fund --prefix host
          npm ci --no-audit --no-fund --prefix collaboration/runtime
      - name: Validate explicit local worker bindings
        run: |
          node collaboration/configure-worker.mjs "$RUNNER_TEMP/worker-config.json" \
            "$(command -v python)" "$(command -v wren)" \
            collaboration/runtime/node_modules/.bin/warble \
            collaboration/runtime/node_modules/@warble/pi/dist/service.js \
            ../../core/wren-context-loader/target/release/wren-context-loader
      - name: Released Python and parser compatibility
        run: node collaboration/check.mjs python "$RUNNER_TEMP/python" "$RUNNER_TEMP/worker-config.json"
      - name: Independent real worker with scripted model
        run: node collaboration/check.mjs worker-service "$RUNNER_TEMP/worker" "$RUNNER_TEMP/worker-config.json"
      - name: Whole host through real Wren with scripted models
        run: node collaboration/check.mjs host-service "$RUNNER_TEMP/host" "$RUNNER_TEMP/worker-config.json"
