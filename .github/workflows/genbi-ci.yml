name: GenBI app CI

# Trigger sources are controlled events (pull_request, push). No untrusted
# issue / comment / external payload is interpolated into run/env contexts
# in this file. ${{ github.* }} usages below are confined to YAML-level
# fields (group), not run scripts.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/genbi/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/genbi-ci.yml'
  push:
    branches:
      - main
      - feat/genbi-app
    paths:
      - 'apps/genbi/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/genbi-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/genbi

jobs:
  ci:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm via packageManager field)
        run: corepack enable

      # The native-session preflight will only run a wren it can trace back to
      # this checkout: it requires an editable install, and checks that the .pth
      # it leaves behind points at core/wren/src inside the same git repository
      # as the server. A release install from PyPI does not satisfy that, so CI
      # installs from the tree it just checked out.
      - name: Install the wren CLI
        uses: astral-sh/setup-uv@v5

      - name: Install wren from this checkout
        working-directory: .
        run: |
          uv tool install --editable ./core/wren
          wren --version
          echo "--- wren shim layout ---"
          ls -l "$HOME/.local/bin/wren" || true
          target=$(readlink -f "$HOME/.local/bin/wren" || true)
          ls -l "$(dirname "$target")/../lib"/python*/site-packages/_editable_impl_wrenai.pth || true

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Warble peer dependency check
        run: pnpm run check:warble-peers

      # Build precedes test deliberately: part of the suite loads the compiled BFF
      # out of dist-server/ to probe it, so on a fresh checkout those tests fail
      # rather than skip if nothing has been built yet.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Packed-install acceptance
        # This packs the actual artifact, installs it below a fresh temporary
        # project, and invokes `npx --no-install genbi` with no checkout PATH.
        # It is deliberately separate from source-tree Vitest coverage.
        run: pnpm run check:installed-package

  vendor-contracts-macos:
    # These are exact tested-baseline checks, not a production certification
    # row. macOS is required because Ubuntu cannot renew macOS sandbox evidence.
    name: macOS deterministic vendor contracts (tested baseline)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact vendor tested baseline
        env:
          GENBI_VENDOR_TOOL_ROOT: ${{ runner.temp }}/genbi-vendor-tools
        run: |
          npm install --prefix "$GENBI_VENDOR_TOOL_ROOT" --no-audit --no-fund --no-save \
            @openai/codex@0.146.0 \
            @anthropic-ai/claude-code@2.1.259 \
            @anthropic-ai/sandbox-runtime@0.0.75

      - name: Run deterministic vendor contracts without credentials or model turns
        env:
          GENBI_VENDOR_TOOL_ROOT: ${{ runner.temp }}/genbi-vendor-tools
        run: node scripts/run-vendor-contract-probes.mjs
