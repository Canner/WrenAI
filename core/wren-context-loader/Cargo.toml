[package]
name = "wren-context-loader"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reads a Wren MDL project into Warble's ContextLoader projection, so a Warble profile can bind a wren project without Warble depending on Wren."
homepage = "https://getwren.ai"
repository = "https://github.com/Canner/WrenAI"
keywords = ["mdl", "semantic-layer", "lineage", "wren"]
categories = ["database"]

[dependencies]
# Pinned to a commit, not a release: `PreparedContext` and `prepared_document_from` are merged to
# warble's `main` but not in a published version yet. This is the squash commit that landed them.
# A branch dep is not usable here — the source branch was deleted on merge, and a deleted ref makes
# every fresh resolution fail while a warm ~/.cargo/git cache still succeeds, so the break would
# only ever show up on someone else's machine. Becomes `warble = "0.10"` once that release lands.
warble = { git = "https://github.com/Canner/Warble", rev = "f6bff4e467cc806094921121d9cfa45992c1af04" }
wren-core-base = { path = "../wren-core-base", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sqlparser = { version = "0.58", features = ["visitor"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
