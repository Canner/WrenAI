# Mirror of cubes/<name>/metadata.yml for consumers that read a root cubes.yml
# (warble bindings/mdl-context). Keep in sync with the cubes/ directory.
- name: mrr_metrics
  base_object: subscription_snapshots
  measures:
    # Semi-additive: additive across subscriptions AT one snapshot_date, never across dates.
    - name: mrr
      expression: SUM(mrr_amount)
      type: DOUBLE
    - name: active_subscriptions
      expression: COUNT(*)
      type: BIGINT
  dimensions:
    - name: status
      expression: status
      type: VARCHAR
  time_dimensions:
    - name: snapshot_date
      expression: snapshot_date
      type: DATE
  properties:
    description: "Point-in-time MRR from month-end snapshots. ALWAYS pin one snapshot_date (or take an average of month-end totals); summing across snapshot dates is meaningless."
- name: order_metrics
  base_object: orders
  measures:
    - name: order_count
      expression: COUNT(*)
      type: BIGINT
    # Additive across orders; header-grain (see knowledge: line-item grain is canonical for merchandise value).
    - name: total_order_value
      expression: SUM(order_total)
      type: DOUBLE
    # Non-additive: an average of parts is not the average of the whole.
    - name: avg_order_value
      expression: AVG(order_total)
      type: DOUBLE
  dimensions:
    - name: status
      expression: status
      type: VARCHAR
    - name: currency
      expression: currency
      type: VARCHAR
  time_dimensions:
    - name: placed_at
      expression: placed_at
      type: TIMESTAMP
  properties:
    description: "New-platform order counts and header-grain value in order currency. Includes migrated legacy copies (legacy_ord_id NOT NULL) — dedup per cross-system rules for all-time counts."
- name: payment_metrics
  base_object: payments
  measures:
    # Additive: gross captured money movement (excl. refund reversals — filter in queries).
    - name: gross_captured
      expression: SUM(amount + fee_amount)
      type: DOUBLE
    - name: net_captured
      expression: SUM(amount)
      type: DOUBLE
    - name: payment_count
      expression: COUNT(*)
      type: BIGINT
  dimensions:
    - name: method
      expression: method
      type: VARCHAR
    - name: currency
      expression: currency
      type: VARCHAR
  time_dimensions:
    - name: captured_at
      expression: captured_at
      type: TIMESTAMP
  properties:
    description: "Captured payment volume in transaction currency. gross = amount + fee_amount; excludes nothing by itself — refund reversals (method='refund_reversal') must be filtered out for revenue, and non-USD amounts converted via fx_rates."
